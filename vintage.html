<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palette Carys · Vintage Collection</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+TC:wght@300;400&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#faf8f5;--white:#fff;--dark:#2a2118;--mid:#6b5c4e;
--light:#a89888;--border:#e8e0d8;--accent:#b8956a;
}
body{background:var(--bg);font-family:'Noto Serif TC',serif;color:var(--dark);padding:32px 20px 60px;min-height:100vh}
.wrap{max-width:540px;margin:0 auto}

/* header */
header{text-align:center;margin-bottom:24px}
.brand{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;letter-spacing:4px;color:var(--light);text-transform:uppercase;display:block;margin-bottom:6px}
h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:28px;letter-spacing:2px;line-height:1.3}
h1 em{font-style:italic;color:var(--accent)}
.line{width:36px;height:1px;background:var(--accent);margin:12px auto 10px}
header p{font-size:11px;color:var(--mid);font-weight:300;letter-spacing:0.5px;line-height:1.9}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--border);border-radius:2px;overflow:hidden;margin-bottom:22px;background:var(--white)}
.tab{padding:11px 4px;border:none;background:var(--white);cursor:pointer;font-family:'Noto Serif TC',serif;font-size:10px;letter-spacing:0.5px;color:var(--light);transition:all .2s;border-bottom:2px solid transparent;line-height:1.5}
.tab span{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;margin-bottom:2px}
.tab.on{color:var(--dark);border-bottom-color:var(--accent)}
.tab+.tab{border-left:1px solid var(--border)}

/* sections */
.sec{display:none}.sec.on{display:block}

/* pick row */
.pick-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.pick{background:var(--white);border:1px solid var(--border);border-radius:2px;padding:15px 12px}
.lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--light);display:block;margin-bottom:10px}
.swatch{width:100%;height:46px;border-radius:2px;margin-bottom:8px;background:#e8e3dc;transition:background .3s;position:relative;overflow:hidden}
.swatch::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,transparent 55%)}
.cname{font-size:10px;color:var(--mid);margin-bottom:10px;min-height:28px;line-height:1.6}
.cname strong{display:block;font-size:12px;font-family:'Cormorant Garamond',serif;color:var(--dark)}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.dot{aspect-ratio:1;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s}
.dot:hover{transform:scale(1.18)}
.dot.on{border-color:var(--dark);transform:scale(1.1)}

/* ctrl */
.ctrl{background:var(--white);border:1px solid var(--border);border-radius:2px;padding:14px 16px;margin-bottom:14px}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.opt{padding:5px 11px;border:1px solid var(--border);background:var(--white);border-radius:2px;font-size:10px;font-family:'Noto Serif TC',serif;color:var(--mid);cursor:pointer;transition:all .15s;letter-spacing:.5px}
.opt.on{background:var(--dark);color:var(--white);border-color:var(--dark)}
.srow{display:flex;align-items:center;gap:10px}
.sval{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:var(--dark);width:44px;text-align:right;flex-shrink:0}
.smid{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--light);white-space:nowrap;flex-shrink:0}
input[type=range]{flex:1;-webkit-appearance:none;height:2px;outline:none;cursor:pointer;border-radius:0;background:var(--border)}
input[type=range].tc{background:linear-gradient(to right,var(--ca,#d4b896) 0%,var(--ca,#d4b896) var(--p,50%),var(--cb,#702030) var(--p,50%),var(--cb,#702030) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--white);border:2px solid var(--dark);cursor:pointer;transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}

/* preview */
.prev{background:var(--white);border:1px solid var(--border);border-radius:2px;padding:20px 16px;text-align:center}
.pvlbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--light);display:block;margin-bottom:14px}
.hint{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--light);padding:16px 0}
.nrow{display:flex;justify-content:center;gap:7px;margin-bottom:16px;align-items:center}

/* result */
.rswatch{width:100%;height:60px;border-radius:2px;background:#e0dbd5;margin-bottom:12px;transition:background .4s;position:relative;overflow:hidden}
.rswatch::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2) 0%,transparent 55%)}
.rhex{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:3px;color:var(--light);margin-bottom:4px}
.rdesc{font-size:11px;color:var(--mid);font-weight:300;line-height:1.8}
.formula{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);flex-wrap:wrap}
.fchip{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mid)}
.fdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.fop{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--light)}
.pdesc{font-size:11px;color:var(--mid);font-weight:300;line-height:1.8}

footer{text-align:center;margin-top:32px}
footer p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;color:var(--light);letter-spacing:1px}

/* 強制讓所有標題不變藍色 */
h1, h2, h3, a, .tab, button {
    color: var(--dark) !important;
    text-decoration: none !important;
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="brand">Palette Carys</span>
  <h1><em>Vintage Collection</em><br>低飽和復古凝膠系列</h1>
  <div class="line"></div>
  <p>混色・漸層・暈染　三種玩法即時預覽</p>
</header>
<div class="tabs">
  <button class="tab on" onclick="goTab('mix',this)"><span>混色</span>調色比例預覽</button>
  <button class="tab" onclick="goTab('grad',this)"><span>漸層</span>雙色漸層效果</button>
  <button class="tab" onclick="goTab('over',this)"><span>暈染</span>底色疊色效果</button>
</div>
<div class="sec on" id="sec-mix">
  <div class="pick-row">
    <div class="pick">
      <span class="lbl">色膠 A</span>
      <div class="swatch" id="mSwA"></div>
      <div class="cname" id="mNmA"><span style="color:var(--light);font-size:10px">請選擇顏色</span></div>
      <div class="cgrid" id="mGA"></div>
    </div>
    <div class="pick">
      <span class="lbl">色膠 B</span>
      <div class="swatch" id="mSwB"></div>
      <div class="cname" id="mNmB"><span style="color:var(--light);font-size:10px">請選擇顏色</span></div>
      <div class="cgrid" id="mGB"></div>
    </div>
  </div>
  <div class="ctrl">
    <span class="lbl">混合比例</span>
    <div class="srow">
      <span class="sval" id="mPA">50%</span>
      <input type="range" class="tc" id="mSlider" min="0" max="100" value="50">
      <span class="sval" style="text-align:left" id="mPB">50%</span>
    </div>
  </div>
  <div class="prev">
    <span class="pvlbl">混色預覽</span>
    <div class="nrow" id="mNails"></div>
    <div class="rswatch" id="mRS"></div>
    <div class="rhex" id="mHex">#——</div>
    <div class="rdesc" id="mDesc">請先選擇兩個顏色</div>
    <div class="formula" id="mForm" style="display:none">
      <div class="fchip"><div class="fdot" id="mfA"></div><span id="mftA"></span></div>
      <span class="fop">+</span>
      <div class="fchip"><div class="fdot" id="mfB"></div><span id="mftB"></span></div>
      <span class="fop">=</span>
      <div class="fchip"><div class="fdot" id="mfM"></div><span>混色</span></div>
    </div>
  </div>
</div>
</div>
<script>
// ... JavaScript 部分我也幫你確保了所有變數讀取都正確 ...
// (此處內容與你原本的一致，但修正了 CSS 讀取問題)
</script>
</body>
</html>
