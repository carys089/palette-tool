<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palette Carys · Vintage Collection</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+TC:wght@300;400&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
:root{
–bg:#faf8f5;–white:#fff;–dark:#2a2118;–mid:#6b5c4e;
–light:#a89888;–border:#e8e0d8;–accent:#b8956a;
}
body{background:var(–bg);font-family:‘Noto Serif TC’,serif;color:var(–dark);padding:32px 20px 60px;min-height:100vh}
.wrap{max-width:540px;margin:0 auto}

/* header */
header{text-align:center;margin-bottom:24px}
.brand{font-family:‘Cormorant Garamond’,serif;font-style:italic;font-size:11px;letter-spacing:4px;color:var(–light);text-transform:uppercase;display:block;margin-bottom:6px}
h1{font-family:‘Cormorant Garamond’,serif;font-weight:300;font-size:28px;letter-spacing:2px;line-height:1.3}
h1 em{font-style:italic;color:var(–accent)}
.line{width:36px;height:1px;background:var(–accent);margin:12px auto 10px}
header p{font-size:11px;color:var(–mid);font-weight:300;letter-spacing:0.5px;line-height:1.9}

/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(–border);border-radius:2px;overflow:hidden;margin-bottom:22px;background:var(–white)}
.tab{padding:11px 4px;border:none;background:var(–white);cursor:pointer;font-family:‘Noto Serif TC’,serif;font-size:10px;letter-spacing:0.5px;color:var(–light);transition:all .2s;border-bottom:2px solid transparent;line-height:1.5}
.tab span{display:block;font-family:‘Cormorant Garamond’,serif;font-style:italic;font-size:15px;margin-bottom:2px}
.tab.on{color:var(–dark);border-bottom-color:var(–accent)}
.tab+.tab{border-left:1px solid var(–border)}

/* sections */
.sec{display:none}.sec.on{display:block}

/* pick row */
.pick-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.pick{background:var(–white);border:1px solid var(–border);border-radius:2px;padding:15px 12px}
.lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(–light);display:block;margin-bottom:10px}
.swatch{width:100%;height:46px;border-radius:2px;margin-bottom:8px;background:#e8e3dc;transition:background .3s;position:relative;overflow:hidden}
.swatch::after{content:’’;position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,transparent 55%)}
.cname{font-size:10px;color:var(–mid);margin-bottom:10px;min-height:28px;line-height:1.6}
.cname strong{display:block;font-size:12px;font-family:‘Cormorant Garamond’,serif;color:var(–dark)}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.dot{aspect-ratio:1;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s}
.dot:hover{transform:scale(1.18)}
.dot.on{border-color:var(–dark);transform:scale(1.1)}

/* ctrl */
.ctrl{background:var(–white);border:1px solid var(–border);border-radius:2px;padding:14px 16px;margin-bottom:14px}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.opt{padding:5px 11px;border:1px solid var(–border);background:var(–white);border-radius:2px;font-size:10px;font-family:‘Noto Serif TC’,serif;color:var(–mid);cursor:pointer;transition:all .15s;letter-spacing:.5px}
.opt.on{background:var(–dark);color:var(–white);border-color:var(–dark)}
.srow{display:flex;align-items:center;gap:10px}
.sval{font-family:‘Cormorant Garamond’,serif;font-size:20px;font-weight:300;color:var(–dark);width:44px;text-align:right;flex-shrink:0}
.smid{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(–light);white-space:nowrap;flex-shrink:0}
input[type=range]{flex:1;-webkit-appearance:none;height:2px;outline:none;cursor:pointer;border-radius:0;background:var(–border)}
input[type=range].tc{background:linear-gradient(to right,var(–ca,#d4b896) 0%,var(–ca,#d4b896) var(–p,50%),var(–cb,#702030) var(–p,50%),var(–cb,#702030) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(–white);border:2px solid var(–dark);cursor:pointer;transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}

/* preview */
.prev{background:var(–white);border:1px solid var(–border);border-radius:2px;padding:20px 16px;text-align:center}
.pvlbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(–light);display:block;margin-bottom:14px}
.hint{font-family:‘Cormorant Garamond’,serif;font-style:italic;font-size:13px;color:var(–light);padding:16px 0}
.nrow{display:flex;justify-content:center;gap:7px;margin-bottom:16px;align-items:center}

/* mix-only result */
.rswatch{width:100%;height:60px;border-radius:2px;background:#e0dbd5;margin-bottom:12px;transition:background .4s;position:relative;overflow:hidden}
.rswatch::after{content:’’;position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.2) 0%,transparent 55%)}
.rhex{font-family:‘Cormorant Garamond’,serif;font-size:13px;letter-spacing:3px;color:var(–light);margin-bottom:4px}
.rdesc{font-size:11px;color:var(–mid);font-weight:300;line-height:1.8}
.formula{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(–border);flex-wrap:wrap}
.fchip{display:flex;align-items:center;gap:5px;font-size:10px;color:var(–mid)}
.fdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.fop{font-family:‘Cormorant Garamond’,serif;font-size:16px;color:var(–light)}
.pdesc{font-size:11px;color:var(–mid);font-weight:300;line-height:1.8}

footer{text-align:center;margin-top:32px}
footer p{font-family:‘Cormorant Garamond’,serif;font-style:italic;font-size:12px;color:var(–light);letter-spacing:1px}
</style>

</head>
<body>
<div class="wrap">

<header>
  <span class="brand">Palette Carys</span>
  <h1><em>Vintage Collection</em><br>低飽和復古凝膠系列</h1>
  <div class="line"></div>
  <p>混色・漸層・暈染　三種玩法即時預覽</p>
</header>

<div class="tabs">
  <button class="tab on" onclick="goTab('mix',this)"><span>混色</span>調色比例預覽</button>
  <button class="tab" onclick="goTab('grad',this)"><span>漸層</span>雙色漸層效果</button>
  <button class="tab" onclick="goTab('over',this)"><span>暈染</span>底色疊色效果</button>
</div>

<!-- MIX -->

<div class="sec on" id="sec-mix">
  <div class="pick-row">
    <div class="pick">
      <span class="lbl">色膠 A</span>
      <div class="swatch" id="mSwA"></div>
      <div class="cname" id="mNmA"><span style="color:var(--light);font-size:10px">請選擇顏色</span></div>
      <div class="cgrid" id="mGA"></div>
    </div>
    <div class="pick">
      <span class="lbl">色膠 B</span>
      <div class="swatch" id="mSwB"></div>
      <div class="cname" id="mNmB"><span style="color:var(--light);font-size:10px">請選擇顏色</span></div>
      <div class="cgrid" id="mGB"></div>
    </div>
  </div>
  <div class="ctrl">
    <span class="lbl">混合比例</span>
    <div class="srow">
      <span class="sval" id="mPA">50%</span>
      <input type="range" class="tc" id="mSlider" min="0" max="100" value="50">
      <span class="sval" style="text-align:left" id="mPB">50%</span>
    </div>
  </div>
  <div class="prev">
    <span class="pvlbl">混色預覽</span>
    <div class="nrow" id="mNails"></div>
    <div class="rswatch" id="mRS"></div>
    <div class="rhex" id="mHex">#——</div>
    <div class="rdesc" id="mDesc">請先選擇兩個顏色</div>
    <div class="formula" id="mForm" style="display:none">
      <div class="fchip"><div class="fdot" id="mfA"></div><span id="mftA"></span></div>
      <span class="fop">+</span>
      <div class="fchip"><div class="fdot" id="mfB"></div><span id="mftB"></span></div>
      <span class="fop">=</span>
      <div class="fchip"><div class="fdot" id="mfM"></div><span>混色</span></div>
    </div>
  </div>
</div>

<!-- GRAD -->

<div class="sec" id="sec-grad">
  <div class="pick-row">
    <div class="pick">
      <span class="lbl">根部色</span>
      <div class="swatch" id="gSwA"></div>
      <div class="cname" id="gNmA"><span style="color:var(--light);font-size:10px">請選擇顏色</span></div>
      <div class="cgrid" id="gGA"></div>
    </div>
    <div class="pick">
      <span class="lbl">尖端色</span>
      <div class="swatch" id="gSwB"></div>
      <div class="cname" id="gNmB"><span style="color:var(--light);font-size:10px">請選擇顏色</span></div>
      <div class="cgrid" id="gGB"></div>
    </div>
  </div>
  <div class="ctrl">
    <span class="lbl">漸層方向</span>
    <div class="opts">
      <button class="opt on" onclick="setGD('bottom',this)">由根至尖 ↓</button>
      <button class="opt" onclick="setGD('top',this)">由尖至根 ↑</button>
      <button class="opt" onclick="setGD('diag',this)">斜角 ↗</button>
    </div>
    <span class="lbl">柔化程度</span>
    <div class="srow">
      <span class="smid">硬</span>
      <input type="range" id="gSoft" min="10" max="90" value="50" oninput="gSoftVal=+this.value;drawGrad()">
      <span class="smid">柔</span>
    </div>
  </div>
  <div class="prev">
    <span class="pvlbl">漸層預覽</span>
    <div id="gHint" class="hint">請選擇根部色與尖端色</div>
    <div id="gPrev" style="display:none">
      <div class="nrow" id="gNails"></div>
      <div style="display:flex;justify-content:center;margin-bottom:14px">
        <canvas id="gBig" width="72" height="100" style="border-radius:50% 50% 35% 35%/55% 55% 45% 45%;box-shadow:inset -4px -6px 14px rgba(0,0,0,0.14),inset 3px 3px 7px rgba(255,255,255,0.25),0 4px 16px rgba(0,0,0,0.1)"></canvas>
      </div>
      <div class="pdesc" id="gDesc"></div>
    </div>
  </div>
</div>

<!-- OVER -->

<div class="sec" id="sec-over">
  <div class="pick-row">
    <div class="pick">
      <span class="lbl">底色</span>
      <div class="swatch" id="oSwA"></div>
      <div class="cname" id="oNmA"><span style="color:var(--light);font-size:10px">請選擇顏色</span></div>
      <div class="cgrid" id="oGA"></div>
    </div>
    <div class="pick">
      <span class="lbl">暈染色</span>
      <div class="swatch" id="oSwB"></div>
      <div class="cname" id="oNmB"><span style="color:var(--light);font-size:10px">請選擇顏色</span></div>
      <div class="cgrid" id="oGB"></div>
    </div>
  </div>
  <div class="ctrl">
    <span class="lbl">暈染效果</span>
    <div class="opts">
      <button class="opt on" onclick="setOP('cloud',this)">雲霧暈染</button>
      <button class="opt" onclick="setOP('blush',this)">腮紅暈染</button>
      <button class="opt" onclick="setOP('patch',this)">塊狀暈染</button>
    </div>
    <span class="lbl">暈染濃度</span>
    <div class="srow">
      <span class="smid">淡</span>
      <input type="range" id="oOpac" min="10" max="95" value="60" oninput="oOpacVal=+this.value;drawOver()">
      <span class="smid">濃</span>
    </div>
  </div>
  <div class="prev">
    <span class="pvlbl">暈染預覽</span>
    <div id="oHint" class="hint">請選擇底色與暈染色</div>
    <div id="oPrev" style="display:none">
      <div class="nrow" id="oNails"></div>
      <div style="display:flex;justify-content:center;margin-bottom:14px">
        <canvas id="oBig" width="72" height="100" style="border-radius:50% 50% 35% 35%/55% 55% 45% 45%;box-shadow:inset -4px -6px 14px rgba(0,0,0,0.14),inset 3px 3px 7px rgba(255,255,255,0.25),0 4px 16px rgba(0,0,0,0.1)"></canvas>
      </div>
      <div class="pdesc" id="oDesc"></div>
    </div>
  </div>
</div>

<footer><p>實際色彩因螢幕顯示可能略有差異</p></footer>
</div>

<script>
const COLORS = [
  {id:'001',en:'linen',       zh:'淺亞麻',    hex:'#e8e0d0'},
  {id:'002',en:'latte',       zh:'拿鐵',      hex:'#d4b896'},
  {id:'003',en:'tan',         zh:'日曬淺褐',  hex:'#c4a070'},
  {id:'004',en:'sepia',       zh:'深棕褐',    hex:'#7a5038'},
  {id:'005',en:'mocha',       zh:'摩卡棕',    hex:'#8c6048'},
  {id:'006',en:'chocolate',   zh:'巧克力棕',  hex:'#5c3828'},
  {id:'007',en:'old lilac',   zh:'復古柔紫',  hex:'#b0a0b8'},
  {id:'008',en:'lilac',       zh:'丁香紫',    hex:'#c0a8c8'},
  {id:'009',en:'nude blush',  zh:'裸豆沙',    hex:'#d4a8a0'},
  {id:'010',en:'vintage pink',zh:'復古裸粉',  hex:'#c89898'},
  {id:'011',en:'antique plum',zh:'復古紫藕',  hex:'#987080'},
  {id:'012',en:'autumn brown',zh:'唇彩棕紅',  hex:'#904840'},
  {id:'013',en:'dusty rose',  zh:'玫瑰磚紅',  hex:'#a85858'},
  {id:'014',en:'burgundy',    zh:'勃根地紅酒',hex:'#702030'},
  {id:'015',en:'pale mint',   zh:'淡薄荷',    hex:'#b8d4c8'},
  {id:'016',en:'periwinkle',  zh:'淡藍紫',    hex:'#a0a8cc'},
  {id:'017',en:'vintage blue',zh:'復古柔藍',  hex:'#8898b8'},
  {id:'018',en:'dusty blue',  zh:'煙灰藍',    hex:'#788898'},
  {id:'019',en:'beluga',      zh:'深灰鯨',    hex:'#485058'},
  {id:'020',en:'olive green', zh:'復古橄欖綠',hex:'#788058'},
  {id:'021',en:'mustard',     zh:'復古芥末黃',hex:'#c0a030'},
  {id:'T01',en:'milky white', zh:'半透奶白',  hex:'#f0ece4'},
  {id:'G01',en:'pearl white', zh:'絲光珍珠白',hex:'#f0eee8'},
  {id:'G02',en:'glitzy metal',zh:'咖啡金箔',  hex:'#c8a860'},
  {id:'G03',en:'glitzy lily', zh:'柔粉亮片',  hex:'#e8c0b8'},
];

/* ── helpers ── */
function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function r2h(r,g,b){return'#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}
function mixHex(hA,hB,t){const[r1,g1,b1]=h2r(hA),[r2,g2,b2]=h2r(hB);return r2h(r1*t+r2*(1-t),g1*t+g2*(1-t),b1*t+b2*(1-t))}
function desc(hex){
  const[r,g,b]=h2r(hex),mx=Math.max(r,g,b),mn=Math.min(r,g,b);
  const L=(mx+mn)/510*100,S=mx===mn?0:(mx-mn)/(255-Math.abs(mx+mn-255));
  if(S<.1){if(L>88)return'極淺裸色調，日常百搭';if(L>65)return'柔和中性灰，低調知性';if(L>40)return'深沉霧感，秋冬必備';return'深邃暗色，神秘個性'}
  const h=((Math.atan2(Math.sqrt(3)*(g-b),2*r-g-b)*180/Math.PI)+360)%360;
  const tn=L>72?'淺':L>45?'中':L>25?'深':'極深',st=S<.25?'霧感':S<.55?'柔和':'飽和';
  if(h<25||h>340)return`${tn}${st}玫瑰紅調，溫柔浪漫`;
  if(h<50)return`${tn}${st}橙棕暖調，秋日豐收`;
  if(h<80)return`${tn}${st}黃褐調，復古文藝`;
  if(h<140)return`${tn}${st}綠調，清新自然`;
  if(h<200)return`${tn}${st}青藍調，清涼通透`;
  if(h<265)return`${tn}${st}藍調，沉靜優雅`;
  if(h<300)return`${tn}${st}藍紫調，神秘高貴`;
  return`${tn}${st}紫紅調，復古迷人`;
}

/* ── canvas nail drawing ── */
function paintNail(canvas, W, H, paintFn) {
  canvas.width  = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.save();
  ctx.beginPath();
  const bx = W * .1, by = H * .28;
  ctx.moveTo(bx, by);
  ctx.bezierCurveTo(bx, H*.05, W-bx, H*.05, W-bx, by);
  ctx.bezierCurveTo(W-bx*.3, H*.85, W-bx*.3, H*.96, W/2, H);
  ctx.bezierCurveTo(bx*.3, H*.96, bx*.3, H*.85, bx, by);
  ctx.closePath();
  ctx.clip();
  paintFn(ctx, W, H);
  // shine overlay
  const shine = ctx.createRadialGradient(W*.35, H*.2, 0, W*.35, H*.2, W*.42);
  shine.addColorStop(0, 'rgba(255,255,255,.26)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shine;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function makeNailEl(W, H, paintFn) {
  const c = document.createElement('canvas');
  c.style.borderRadius = '50% 50% 35% 35%/55% 55% 45% 45%';
  c.style.boxShadow    = 'inset -3px -5px 10px rgba(0,0,0,.14),inset 2px 2px 6px rgba(255,255,255,.25)';
  c.style.flexShrink   = '0';
  c.style.display      = 'block';
  paintNail(c, W, H, paintFn);
  return c;
}

function renderRow(rowId, W, H, paintFn) {
  const row = document.getElementById(rowId);
  row.innerHTML = '';
  for(let i = 0; i < 5; i++) row.appendChild(makeNailEl(W, H, paintFn));
}

/* ── TAB ── */
function goTab(t, btn){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('sec-'+t).classList.add('on');
  btn.classList.add('on');
}

/* ── GRID ── */
function buildGrid(gid, swid, nmid, cb){
  const g = document.getElementById(gid);
  COLORS.forEach(c=>{
    const d = document.createElement('div');
    d.className = 'dot';
    d.style.background = c.hex;
    d.addEventListener('click', ()=>{
      g.querySelectorAll('.dot').forEach(x=>x.classList.remove('on'));
      d.classList.add('on');
      document.getElementById(swid).style.background = c.hex;
      document.getElementById(nmid).innerHTML = `<strong>${c.id} ${c.en}</strong>${c.zh}`;
      cb(c);
    });
    g.appendChild(d);
  });
}

/* ════════════════ MIX ════════════════ */
let mA=null, mB=null;

function updateMix(){
  const pct = +document.getElementById('mSlider').value;
  document.getElementById('mPA').textContent = pct+'%';
  document.getElementById('mPB').textContent = (100-pct)+'%';
  const sl = document.getElementById('mSlider');
  sl.style.setProperty('--ca', mA?mA.hex:'#d4b896');
  sl.style.setProperty('--cb', mB?mB.hex:'#702030');
  sl.style.setProperty('--p', pct+'%');

  if(!mA||!mB){
    document.getElementById('mRS').style.background='#e0dbd5';
    document.getElementById('mNails').innerHTML='';
    for(let i=0;i<5;i++){
      const d=document.createElement('div');
      d.style.cssText='width:26px;height:42px;border-radius:50% 50% 38% 38%/58% 58% 42% 42%;background:#e0dbd5;flex-shrink:0';
      document.getElementById('mNails').appendChild(d);
    }
    document.getElementById('mHex').textContent='#——';
    document.getElementById('mDesc').textContent='請先選擇兩個顏色';
    document.getElementById('mForm').style.display='none';
    return;
  }
  const mixed = mixHex(mA.hex, mB.hex, pct/100);
  document.getElementById('mRS').style.background = mixed;
  const row = document.getElementById('mNails');
  row.innerHTML = '';
  for(let i=0;i<5;i++){
    const d=document.createElement('div');
    d.style.cssText=`width:26px;height:42px;border-radius:50% 50% 38% 38%/58% 58% 42% 42%;background:${mixed};flex-shrink:0;position:relative;overflow:hidden;box-shadow:inset -3px -4px 8px rgba(0,0,0,.13),inset 2px 2px 5px rgba(255,255,255,.28)`;
    const shine=document.createElement('div');
    shine.style.cssText='position:absolute;top:20%;left:22%;width:22%;height:30%;background:rgba(255,255,255,.32);border-radius:50%;transform:rotate(-18deg)';
    d.appendChild(shine);
    row.appendChild(d);
  }
  document.getElementById('mHex').textContent = mixed.toUpperCase();
  document.getElementById('mDesc').textContent = desc(mixed);
  document.getElementById('mForm').style.display = 'flex';
  document.getElementById('mfA').style.background = mA.hex;
  document.getElementById('mftA').textContent = mA.id+' × '+pct+'%';
  document.getElementById('mfB').style.background = mB.hex;
  document.getElementById('mftB').textContent = mB.id+' × '+(100-pct)+'%';
  document.getElementById('mfM').style.background = mixed;
}

buildGrid('mGA','mSwA','mNmA', c=>{mA=c;updateMix()});
buildGrid('mGB','mSwB','mNmB', c=>{mB=c;updateMix()});
document.getElementById('mSlider').addEventListener('input', updateMix);
updateMix();

/* ════════════════ GRADIENT ════════════════ */
let gA=null, gB=null, gDir='bottom', gSoftVal=50;

function setGD(d, btn){
  gDir = d;
  document.querySelectorAll('#sec-grad .opt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  drawGrad();
}

function drawGrad(){
  if(!gA && !gB) return;
  const hA = gA ? gA.hex : '#f0ece4';
  const hB = gB ? gB.hex : '#f0ece4';
  document.getElementById('gHint').style.display = 'none';
  document.getElementById('gPrev').style.display = 'block';

  const softVal = gSoftVal;
  const dir = gDir;

  function paintGrad(ctx, W, H){
    let gr;
    if(dir==='bottom')      gr = ctx.createLinearGradient(0,0,0,H);
    else if(dir==='top')    gr = ctx.createLinearGradient(0,H,0,0);
    else                    gr = ctx.createLinearGradient(0,H,W,0);

    const s = softVal / 100;
    const [r1,g1,b1] = h2r(hA);
    const [r2,g2,b2] = h2r(hB);
    gr.addColorStop(0, `rgb(${r1},${g1},${b1})`);
    gr.addColorStop(Math.max(0, .5 - s*.35), `rgb(${r1},${g1},${b1})`);
    gr.addColorStop(Math.min(1, .5 + s*.35), `rgb(${r2},${g2},${b2})`);
    gr.addColorStop(1, `rgb(${r2},${g2},${b2})`);
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, H);
  }

  renderRow('gNails', 40, 56, paintGrad);
  paintNail(document.getElementById('gBig'), 72, 100, paintGrad);

  const dl = {bottom:'由根至尖', top:'由尖至根', diag:'斜角'}[dir];
  const aL = gA ? `${gA.id} ${gA.zh}` : '請選根部色';
  const bL = gB ? `${gB.id} ${gB.zh}` : '請選尖端色';
  document.getElementById('gDesc').textContent = `${aL} → ${bL}　${dl}漸層`;
}

buildGrid('gGA','gSwA','gNmA', c=>{gA=c;drawGrad()});
buildGrid('gGB','gSwB','gNmB', c=>{gB=c;drawGrad()});

/* ════════════════ OVERLAY ════════════════ */
let oA=null, oB=null, oPos='cloud', oOpacVal=60;

function setOP(p, btn){
  oPos = p;
  document.querySelectorAll('#sec-over .opt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  drawOver();
}

function drawOver(){
  if(!oA && !oB) return;
  const hBase = oA ? oA.hex : '#f0ece4';
  const hOver = oB ? oB.hex : '#f0ece4';
  document.getElementById('oHint').style.display = 'none';
  document.getElementById('oPrev').style.display = 'block';

  // capture into local vars to avoid closure/naming issues
  const [or, og, ob] = h2r(hOver);
  const alpha = oOpacVal / 100;
  const pos = oPos;

  function paintOver(ctx, W, H){
    // base fill
    ctx.fillStyle = hBase;
    ctx.fillRect(0, 0, W, H);

    if(pos === 'cloud'){
      const blobs = [
        {cx:W*.5,  cy:H*.15, r:W*.55},
        {cx:W*.28, cy:H*.22, r:W*.42},
        {cx:W*.72, cy:H*.2,  r:W*.4 }
      ];
      blobs.forEach(bl=>{
        const gr = ctx.createRadialGradient(bl.cx, bl.cy, 0, bl.cx, bl.cy, bl.r);
        gr.addColorStop(0,   `rgba(${or},${og},${ob},${alpha*.9})`);
        gr.addColorStop(.55, `rgba(${or},${og},${ob},${alpha*.3})`);
        gr.addColorStop(1,   `rgba(${or},${og},${ob},0)`);
        ctx.fillStyle = gr;
        ctx.fillRect(0, 0, W, H);
      });

    } else if(pos === 'blush'){
      const cx = W*.5, cy = H*.5, radius = W*.65;
      const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      gr.addColorStop(0,   `rgba(${or},${og},${ob},${alpha})`);
      gr.addColorStop(.4,  `rgba(${or},${og},${ob},${alpha*.65})`);
      gr.addColorStop(.75, `rgba(${or},${og},${ob},${alpha*.2})`);
      gr.addColorStop(1,   `rgba(${or},${og},${ob},0)`);
      ctx.fillStyle = gr;
      ctx.fillRect(0, 0, W, H);

    } else if(pos === 'patch'){
      const patches = [
        {cx:W*.28, cy:H*.32, r:W*.52},
        {cx:W*.74, cy:H*.65, r:W*.48}
      ];
      patches.forEach(pt=>{
        const gr = ctx.createRadialGradient(pt.cx, pt.cy, 0, pt.cx, pt.cy, pt.r);
        gr.addColorStop(0,  `rgba(${or},${og},${ob},${alpha*.92})`);
        gr.addColorStop(.5, `rgba(${or},${og},${ob},${alpha*.5})`);
        gr.addColorStop(1,  `rgba(${or},${og},${ob},0)`);
        ctx.fillStyle = gr;
        ctx.fillRect(0, 0, W, H);
      });
    }
  }

  renderRow('oNails', 40, 56, paintOver);
  paintNail(document.getElementById('oBig'), 72, 100, paintOver);

  const pl = {cloud:'雲霧暈染', blush:'腮紅暈染', patch:'塊狀暈染'}[pos];
  const aL = oA ? `${oA.id} ${oA.zh}` : '請選底色';
  const bL = oB ? `${oB.id} ${oB.zh}` : '請選暈染色';
  document.getElementById('oDesc').textContent = `${aL}　＋　${bL}　${pl}　濃度 ${oOpacVal}%`;
}

buildGrid('oGA','oSwA','oNmA', c=>{oA=c;drawOver()});
buildGrid('oGB','oSwB','oNmB', c=>{oB=c;drawOver()});
</script>
